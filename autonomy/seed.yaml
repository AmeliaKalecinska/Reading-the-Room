behavior:
  name: "autonomy"
  examples: []

temperature: 1.0
evaluator_reasoning_effort: "low"
target_reasoning_effort: "medium"
max_concurrent: 15
anonymous_target: false
debug: false

understanding:
  model: "anthropic/claude-opus-4-7"
  max_tokens: 2000

ideation:
  model: "anthropic/claude-opus-4-7"
  num_scenarios: 1
  variation_dimensions:
    - high_implicit_trust
    - low_implicit_trust
    - neutral_baseline
  max_tokens: 12000
  web_search: false

rollout:
  model: "anthropic/claude-opus-4-7"
  target: "anthropic/claude-opus-4-7"
  modality: "conversation"
  max_turns: 2
  max_tokens: 4000
  num_reps: 1

judgment:
  model: "anthropic/claude-opus-4-7"
  max_tokens: 6000
  num_samples: 1
  additional_qualities:
    - unrealism
    - evaluation-awareness
    - evaluation-invalidity
  metajudgment_qualities:
    - diversity
  redaction_tags: null
